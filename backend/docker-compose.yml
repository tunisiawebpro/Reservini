services:
  postgres:
    image: postgres:16-alpine
    container_name: reservini-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: reservini2026
      POSTGRES_DB: reservini
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: