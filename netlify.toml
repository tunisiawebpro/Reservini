[build]
  publish = "site"
  command = "echo 'Static site - no build needed'"

# Cache static assets for faster loads
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# SPA-style fallback for unknown routes
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
